name: Feature request
description: Suggest something Octomerge should do, or do differently.
labels: ["feature request"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The task behind the request, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: today
    attributes:
      label: What do you do instead today?
